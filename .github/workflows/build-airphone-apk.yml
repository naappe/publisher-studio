name: Build AirPhone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - airphone-android-apk
    paths:
      - 'android/**'
      - '.github/workflows/build-airphone-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-airphone-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AirPhone-Research-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPhone-Research-APK
          path: AirPhone-Research-debug.apk
          if-no-files-found: error
          retention-days: 30
