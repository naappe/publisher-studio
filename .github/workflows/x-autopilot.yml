name: X Autopilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = simulate, false = post live"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "30 1,7,13,16 * * *"

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run X autopilot
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.X_AUTOPILOT_DRY_RUN || 'true' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python automation/autopilot.py
      - name: Commit queue/log changes
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name != 'workflow_dispatch' && vars.X_AUTOPILOT_DRY_RUN == 'false') }}
        run: |
          git config user.name "x-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/queue.json automation/posted.json
          git diff --cached --quiet || git commit -m "X autopilot: update queue"
          git push
