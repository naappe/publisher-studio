name: Build LAN Lens APK

on:
  push:
    branches:
      - lanlens-apk-build-20260909
    paths:
      - 'lanlens/**'
      - '.github/workflows/lanlens-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        working-directory: lanlens
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanLens-APK
          path: lanlens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
